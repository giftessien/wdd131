
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Discover Nigeria, its location, climate, culture, and beautiful places.">
    <meta name="author" content="Akpan Enobong Essien">

    <title>Discover Nigeria | WDD 131</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>

<body>

    <header>
        <h1>Discover Nigeria</h1>
    </header>

    <main>
        <div class="hero">
   <div class="hero">
    <picture>
        <source
            media="(max-width: 600px)"
            srcset="images/nigeria-small.webp">

        <source
            media="(min-width: 601px)"
            srcset="images/nigeria-large.webp">

        <img
            src="images/nigeria-large.webp"
            alt="Natural waterfall surrounded by lush vegetation in Nigeria"
            class="hero-image">
    </picture>
    </div>

        <section class="country-data">
            <h2>Data</h2>
            <p><strong>Country:</strong> Nigeria</p>
            <p><strong>Capital:</strong> Abuja</p>
            <p><strong>Continent:</strong> Africa</p>
            <p><strong>Currency:</strong> Nigerian Naira</p>
            <p><strong>Language:</strong> English</p>
        </section>

      <h2>Weather</h2>

        <img
             src="images/weather.svg"alt="Partly cloudy weather"
             class="weather-icon">

    <p><strong>Temperature:</strong>
        <span id="temperature">--</span>
    </p>

    <p><strong>Conditions:</strong>
        <span id="conditions">Partly cloudy</span>
    </p>

    <p><strong>Wind:</strong>
        <span id="wind">--</span>
    </p>

    <p><strong>Wind Chill:</strong>
        <span id="windchill">--</span>
    </p>
    </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Akpan Enobong Essien | Nigeria</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

</body>
</html>
